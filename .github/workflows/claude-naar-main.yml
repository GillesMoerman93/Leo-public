name: Claude-tak naar main
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
  pages: write
concurrency:
  group: claude-naar-main
  cancel-in-progress: false
jobs:
  samenvoegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Samenvoegen met main
        env:
          TAK: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TAK"
          git merge --no-edit "origin/$TAK"
          git push origin main
          git push origin --delete "$TAK" || true
      - name: Website opnieuw publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
